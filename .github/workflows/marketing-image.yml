name: Publish marketing image

on:
  push:
    branches:
      - main
    paths:
      - "marketing/**"
      - ".github/workflows/marketing-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-marketing-image
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/vatsalp117/iris-marketing

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            tag_suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag_suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish marketing image
        uses: docker/build-push-action@v6
        with:
          context: ./marketing
          file: ./marketing/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:build-${{ matrix.tag_suffix }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=marketing-${{ matrix.tag_suffix }}
          cache-to: type=gha,mode=max,scope=marketing-${{ matrix.tag_suffix }}

  publish:
    name: Publish multi-platform manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish marketing image manifest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            --tag "${IMAGE_NAME}:sha-${GITHUB_SHA}" \
            "${IMAGE_NAME}:build-amd64-${GITHUB_SHA}" \
            "${IMAGE_NAME}:build-arm64-${GITHUB_SHA}"
